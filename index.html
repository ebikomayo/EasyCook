<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>EasyCook - Recipe Explorer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <h2>EasyCook</h2>
        <div class="nav-links">
            <a href="index.html" class="active">Recipe Explorer</a>
            <a href="mealplan.html">My Meal Plan</a>
        </div>
    </nav>

    
    <img src="image/banner.jpg" style="width:100%; height:300px; object-fit:contain; object-position:center; display:block; background:#FFE69A;">


    </header>

    <div class="container">
        <h1>Recipe Explorer</h1>
        <p class="hint">Choose a category, type a meal name, or both, then click Find Recipes.</p>

        <div class="controls">
            <label>Category
                <select id="categorySelect"><option value="">Any category</option></select>
            </label>
            <label>Meal name (optional)
                <input id="nameInput" type="text" placeholder="e.g. curry">
            </label>
            <button id="searchBtn">Find Recipes</button>
        </div>

        <p id="message" class="message"></p>

        <div id="suggestion" class="details"></div>
        <div id="details" class="details"></div>

        <h3>Results</h3>
        <div id="results" class="grid"></div>
    </div>

    <script src="storage.js"></script>
    <script src="recipes.js"></script>
</body>
</html>
